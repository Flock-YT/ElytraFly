# ElytraFly 配置 / Settings
# 默认即可使用；修改后保存并重启服务端。true = 开启，false = 关闭。
# Ready to use. Save and restart after edits. true = on, false = off.
# 保留每行开头的空格，不要用 Tab。 / Keep leading spaces; do not use Tab.

# 游戏提示语言：zh_CN = 中文，en_US = 英文
# In-game language: zh_CN = Chinese, en_US = English
language: zh_CN

# 使用统计：不想参与就把下面的 enabled 改成 false。
# Usage statistics: set enabled below to false to opt out.
bstats:
  enabled: true

settings:
  # 多久检查一次飞行和耐久：20 约为 1 秒，40 约为 2 秒，必须填正整数。
  # 建议保持 20；调大会减慢耐久消耗，也会延迟发现装备或权限变化。
  # Flight/durability check interval: 20 is about 1 second, 40 about 2. Use a positive integer.
  # Keep 20 unless needed; larger values slow wear and detection of equipment/permission changes.
  check-interval: 20

  durability:
    # 飞行是否消耗耐久：false = 不消耗，但仍需穿戴未损坏的鞘翅。
    # Consume durability while flying. false = no wear; a usable elytra is still required.
    enabled: true
    # true = 耐久附魔等级越高越省耐久；false = 使用下面自定义的概率。
    # true = Unbreaking reduces wear; false = use custom-chance below.
    use-vanilla-formula: true
    # 仅在上一项为 false 时生效：每次检查扣 1 点耐久的概率。
    # 填 0 到 1：0.5 = 50%，1 = 每次都扣，0 = 不扣。
    # Only used when use-vanilla-formula is false: chance to lose 1 durability per check.
    # Use 0 to 1: 0.5 = 50%, 1 = every check, 0 = never.
    custom-chance: 0.5

  world-list:
    # BLACKLIST = 列表中的世界禁止飞行；WHITELIST = 只允许列表中的世界飞行。
    # BLACKLIST = block listed worlds; WHITELIST = allow only listed worlds.
    # false = 关闭世界限制，允许所有世界，忽略下方列表中的世界名。
    # false = disable world restrictions, allowing all worlds regardless of the names listed below.
    # OP 默认不受限制; 进入禁飞世界会停止飞行。
    # OPs bypass this by default; Entering a blocked world stops flight.
    type: false
    # 把示例换成实际世界名，大小写要一致，如 world_nether；每行一个。
    # 默认不限制世界；如需启用，把 type 改为 BLACKLIST 或 WHITELIST。
    # Replace the example with actual world names, matching case, e.g. world_nether; one per line.
    # World restrictions are disabled by default; set type to BLACKLIST or WHITELIST to enable them.
    worlds:
      - "example_world_name"
