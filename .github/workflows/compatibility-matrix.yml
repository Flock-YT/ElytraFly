name: ElytraFly CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify / Spigot 1.21 / JDK 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify with Maven
        run: mvn -B --no-transfer-progress clean verify

      - name: Verify release JAR
        run: ./scripts/verify-release-jar.sh

  compile:
    name: Spigot ${{ matrix.api }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 1.21-R0.1-SNAPSHOT
            java: '21'
          - api: 1.21.11-R0.1-SNAPSHOT
            java: '21'
          - api: 26.3-R0.1-SNAPSHOT
            java: '25'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile against Spigot API ${{ matrix.api }}
        run: >-
          mvn -B --no-transfer-progress clean package
          -Dspigot.version=${{ matrix.api }}
          -Dmaven.test.skip=true
